services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      MAX_WORKERS: ${MAX_WORKERS:-2}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
    tmpfs:
      - /data:uid=1000

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${PORT:-8080}:80"
